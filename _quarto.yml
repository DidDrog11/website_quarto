project:
  type: website
  render:
    - "*.qmd"
    - "!cv.qmd"
    # Talk decks are not published yet. "*.qmd" above matches in every
    # folder, so they must be excluded explicitly. Remove this line to publish.
    - "!presentations/"
    - "arha/"
    - "covid/"
    - "images/"
    - "lassa/"
    - "monkeypox/"
    - "open_science/"
    - "policy/"
    - "others/"
    - "rodent_ecology/"
  resources:
    - "assets/fonts/*"
    - "assets/js/*"
    - "assets/data/*"
    - "images/hero_landscape.webp"
    - "_redirects"
    - "cv.pdf"
    - "images/cards/*"
    - "data/lassa_cases.csv"
    - "data/lassa_hosts.csv"
    # Images and files from the retired paper pages (2026-10-05). Nothing links
    # to some of them any more, so they are listed here to keep their old URLs.
    - "arha/figures/*"
    - "arha/files/*"
    - "covid/images/*"
    - "lassa/images/*"
    - "lassa/files/*"
    - "open_science/images/*"
    - "others/images/*"
    - "policy/images/*"

website:
  title: "David Simons"
  site-url: https://www.dsimons.org
  favicon: /images/icon.ico
  open-graph: true
  twitter-card: true
  page-navigation: true
  # No analytics. Nothing here may set a cookie.
  navbar:
    pinned: true   # always visible, so the menu is there at the bottom of a page
    foreground: dark
    background: light
    search: true
    left:
      - text: "Research"
        menu:
          - text: "All research"
            href: research/index.qmd
          - text: "---"
          - text: "On the gradient"
          - text: "Host ecology in Sierra Leone"
            href: research/sierra-leone.qmd
          - text: "SCAPES, Nigeria"
            href: research/scapes.qmd
          - text: "Bank voles at Uppsala"
            href: research/bank-voles.qmd
          - text: "Surveillance and outbreak response"
            href: research/surveillance.qmd
          - text: "Vaccines and trial design"
            href: research/vaccines.qmd
          - text: "Rodent-borne disease ecology"
            href: research/rodent-disease-ecology.qmd
          - text: "---"
          - text: "Off the gradient"
          - text: "Project ArHa"
            href: research/arha.qmd
          - text: "Lassa fever and cities"
            href: research/lassa-cities.qmd
          - text: "Lassa epidemiology"
            href: research/lassa-epidemiology.qmd
          - text: "Open tools and data"
            href: research/tools.qmd
          - text: "Consultancy"
            href: consultancy.qmd
          - text: "Earlier work"
            href: research/earlier-work.qmd
      - href: publications.qmd
        text: "Publications"
      - href: about.qmd
        text: "About"
      - href: cv.pdf
        text: "CV"
    right:
      - icon: bluesky
        href: https://bsky.app/profile/davidsimons.bsky.social
        aria-label: Bluesky
      - icon: github
        href: https://github.com/DidDrog11
        aria-label: GitHub
  page-footer:
    left: "© David Simons"
    center: "Built with [Quarto](https://quarto.org). [Source](https://github.com/DidDrog11/website_quarto)."
    right: "[ORCID](https://orcid.org/0000-0001-9655-1656)"

format:
  html:
    theme:
      light: scss/custom.scss
      dark: [scss/custom.scss, scss/dark.scss]
    toc: true
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    # Internal: the site with or without www, its Netlify addresses (branch and
    # deploy previews are <name>--davidsimons.netlify.app), and local previews.
    # Anything else is external. Quarto tests the full resolved address, so a host
    # missing here makes every internal link open in a new tab on that host.
    link-external-filter: '^https?:\/\/(?:(?:www\.)?dsimons\.org|(?:[a-z0-9-]+--)?davidsimons\.netlify\.app|localhost|127\.0\.0\.1)(?::\d+)?(?:\/|$)'
    include-after-body:
      - assets/request-copy.html
      - assets/goatcounter.html

execute:
  freeze: auto
