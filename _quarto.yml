project:
  type: website
  render:
    - "*.qmd"
    - "!cv.qmd"
    - "amr/"
    - "arha/"
    - "covid/"
    - "images/"
    - "lassa/"
    - "monkeypox/"
    - "open_science/"
    - "policy/"
    - "others/"
    - "rodent_ecology/"
  resources:
    - "assets/fonts/*"
    - "cv.pdf"

website:
  title: "David Simons"
  site-url: https://www.dsimons.org
  favicon: /images/icon.ico
  open-graph: true
  twitter-card: true
  page-navigation: true
  # No analytics. Nothing here may set a cookie.
  navbar:
    foreground: dark
    background: light
    search: true
    left:
      - text: "Research"
        menu:
          - text: "Along the gradient"
          - text: "Host ecology in Sierra Leone"
            href: lassa/sierra_leone.qmd
          - text: "SCAPES, Nigeria"
            href: lassa/SCAPES.qmd
          - text: "Lassa fever and cities"
            href: lassa/lassa_urbanisation.qmd
          - text: "Lassa epidemiology"
            href: lassa/lassa_epidemiology.qmd
          - text: "Project ArHa"
            href: arha.qmd
          - text: "Bank voles at Uppsala"
            href: rodent_ecology/sintring.qmd
          - text: "---"
          - text: "Off the gradient"
          - text: "Vaccines and trial design"
            href: policy/vaccines.qmd
          - text: "Surveillance and outbreak response"
            href: policy/surveillance.qmd
          - text: "Open tools and data"
            href: open_science/tools.qmd
          - text: "Rodent-borne disease ecology"
            href: rodent_ecology/lancet_pillars_view.qmd
          - text: "---"
          - text: "Consultancy"
            href: consultancy.qmd
          - text: "Earlier work"
            href: others.qmd
      - href: publications.qmd
        text: "Publications"
      - href: about.qmd
        text: "About"
      - href: cv.pdf
        text: "CV"
    right:
      - icon: bluesky
        href: https://bsky.app/profile/davidsimons.bsky.social
        aria-label: Bluesky
      - icon: github
        href: https://github.com/DidDrog11
        aria-label: GitHub
  page-footer:
    left: "© David Simons"
    center: "Built with [Quarto](https://quarto.org). [Source](https://github.com/DidDrog11/website_quarto)."
    right: "[ORCID](https://orcid.org/0000-0001-9655-1656)"

format:
  html:
    theme:
      light: scss/custom.scss
      dark: [scss/custom.scss, scss/dark.scss]
    toc: true
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/www\.dsimons\.org\/'
    include-after-body: assets/request-copy.html

comments:
  hypothesis:
    theme: clean

execute:
  freeze: auto
