<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="white"/>

  <!-- Steps around the loop -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="340" y="30" width="220" height="60" rx="10" fill="#dbe8f4"/>
    <rect x="650" y="140" width="220" height="60" rx="10" fill="#dbe8f4"/>
    <rect x="530" y="330" width="220" height="60" rx="10" fill="#f6d6db" stroke="#d1495b" stroke-width="3"/>
    <rect x="30" y="140" width="220" height="60" rx="10" fill="#dbe8f4"/>
  </g>
  <!-- Field sampling is the extension beyond this project, so dashed -->
  <rect x="150" y="330" width="220" height="60" rx="10" fill="#f3f8f0" stroke="#888" stroke-width="1.5"
        stroke-dasharray="8,6"/>
  <g font-size="21" fill="#222" text-anchor="middle" dominant-baseline="middle">
    <text x="450" y="60">1. Fit the model</text>
    <text x="760" y="170">2. Map uncertainty</text>
    <text x="640" y="360">3. Choose sites</text>
    <text x="260" y="360" fill="#666">4. Sample</text>
    <text x="140" y="170">5. Refit</text>
  </g>

  <!-- Arrows between steps -->
  <g stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M565,75 L680,133"/>
    <path d="M745,205 L690,323"/>
    <path d="M200,135 L333,75"/>
    <!-- In this project: simulated results go straight from site choice to refit -->
    <path d="M535,325 L257,203"/>
  </g>
  <g stroke="#999" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrow)">
    <path d="M525,360 L377,360"/>
    <path d="M210,325 L160,207"/>
  </g>

  <!-- Notes -->
  <g font-size="16" fill="#444" text-anchor="middle">
    <text x="640" y="415">where new data would help most,</text>
    <text x="640" y="435">within travel time, terrain and weather</text>
    <text x="260" y="415" fill="#666">field teams: the next step</text>
    <text x="450" y="160">This project: simulated</text>
    <text x="450" y="182">results at chosen sites</text>
  </g>
</svg>
